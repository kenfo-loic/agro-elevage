<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centre de Notifications — AgroElevage Link</title>
  <meta name="description" content="Consultez les mises à jour en direct sur vos commandes, paiements séquestres, alertes météo et conseils agronomiques." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <!-- ===================================================================
       WEB APPLICATION SHELL (PURE FULLSCREEN WEB APP)
       =================================================================== -->
  <div class="web-app-shell">
    
    <!-- Shared Web Sidebar (Injected by layout.js) -->
    <div id="sidebar-root"></div>

    <!-- Main Content Area -->
    <div class="web-main-container">
      
      <!-- Top Navigation Bar -->
      <header class="web-topbar">
        <div class="web-topbar-left">
          <button class="web-menu-toggle" id="btnToggleMobileMenu" title="Ouvrir le menu de navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg> <span>Menu</span></button>
          <span class="web-page-heading-title"> Centre de Notifications</span>
        </div>

        <div class="web-topbar-right">
          <button class="btn-secondary" id="btnMarkAllNotifs" style="height: 36px; padding: 0 14px; font-size: 12.5px; font-weight: 700; border-radius: 8px; border: 1px solid var(--border-color); background: #ffffff; cursor: pointer;">
             Marquer tout comme lu
          </button>

          <a href="profil.html" class="web-topbar-btn-circle" title="Profil">
            <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          </a>
        </div>
      </header>

      <!-- Main Content Body -->
      <main class="web-content-body">
        
        <div class="web-card" style="max-width: 900px; margin: 0 auto;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
              <h2 style="font-family: var(--font-heading); font-size: 18px; font-weight: 800; color: var(--text-main);">Vos Activités & Alertes Récentes</h2>
              <p style="font-size: 12.5px; color: var(--text-muted);">Mises à jour des commandes, modifications de profil, ajouts et suppressions de produits</p>
            </div>
            <span id="notifHeaderBadge" style="font-size: 12px; background: var(--primary-soft); color: var(--primary-dark); font-weight: 800; padding: 4px 10px; border-radius: 999px;">
              0 Nouvelle
            </span>
          </div>

          <div id="notificationsList" style="display: flex; flex-direction: column; gap: 12px;">
            <!-- Notifications injected dynamically via JS -->
          </div>
        </div>

      </main>

    </div>
  </div>

  <!-- Interactive Toast -->
  <div class="toast-msg" id="appToast">Notifications mises à jour</div>

  <!-- Navigation & Layout Helpers -->
  <script src="js/layout.js"></script>
  <script src="js/mpa_app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const listContainer = document.getElementById('notificationsList');
      const badgeCount = document.getElementById('notifHeaderBadge');
      const btnMarkRead = document.getElementById('btnMarkAllNotifs');

      function renderNotifications() {
        const notifs = JSON.parse(localStorage.getItem('ago_notifications') || '[]');
        const unreadCount = notifs.filter(n => !n.isRead).length;

        if (badgeCount) {
          badgeCount.textContent = unreadCount > 0 ? `${unreadCount} Non lue${unreadCount > 1 ? 's' : ''}` : 'Toutes lues';
        }

        if (!listContainer) return;

        const NOTIF_SVGS = {
          product: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`,
          stock: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
          profile: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
          danger: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`,
          order: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18.5" r="2.5"/><circle cx="7" cy="18.5" r="2.5"/></svg>`,
          escrow: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
          info: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`
        };

        if (notifs.length === 0) {
          listContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px;">Aucune notification pour le moment. Vos activités (ajouts, modifications, suppressions) s\'afficheront ici.</div>';
          return;
        }

        listContainer.innerHTML = notifs.map(n => {
          let borderClr = 'var(--primary)';
          let bgClr = '#ffffff';

          if (n.type === 'product') { borderClr = 'var(--primary)'; bgClr = 'var(--primary-soft)'; }
          else if (n.type === 'stock') { borderClr = 'var(--accent-gold)'; bgClr = '#fffdf5'; }
          else if (n.type === 'profile') { borderClr = '#3b82f6'; bgClr = '#eff6ff'; }
          else if (n.type === 'danger') { borderClr = 'var(--danger)'; bgClr = '#fef2f2'; }
          else if (n.type === 'order') { borderClr = 'var(--accent-gold)'; bgClr = '#fffdf5'; }
          else if (n.type === 'escrow') { borderClr = 'var(--success)'; bgClr = '#f0fdf4'; }

          const svgIcon = NOTIF_SVGS[n.type] || NOTIF_SVGS.info;
          const cleanTitle = (n.title || '').replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '').trim();
          const cleanMessage = (n.message || '').replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '').trim();

          return `
            <div class="web-card" style="display: flex; gap: 16px; align-items: flex-start; padding: 16px; border-left: 4px solid ${borderClr}; ${n.isRead ? 'background: #ffffff;' : 'background: ' + bgClr + ';'}">
              <div style="width: 44px; height: 44px; border-radius: 12px; background: var(--bg-subtle); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                ${svgIcon}
              </div>
              <div style="flex: 1;">
                <div style="display: flex; justify-content: space-between; align-items: baseline;">
                  <strong style="font-size: 14px; font-family: var(--font-heading);">${cleanTitle}</strong>
                  <span style="font-size: 11.5px; color: var(--text-muted);">${n.date}, ${n.time}</span>
                </div>
                <p style="font-size: 12.5px; color: var(--text-muted); margin: 3px 0 6px;">${cleanMessage}</p>
                ${n.link ? `<a href="${n.link}" style="font-size: 12px; color: var(--primary); font-weight: 700; text-decoration: none;">Voir les détails ›</a>` : ''}
              </div>
            </div>
          `;
        }).join('');
      }

      renderNotifications();

      if (btnMarkRead) {
        btnMarkRead.addEventListener('click', () => {
          let notifs = JSON.parse(localStorage.getItem('ago_notifications') || '[]');
          notifs.forEach(n => n.isRead = true);
          localStorage.setItem('ago_notifications', JSON.stringify(notifs));
          if (typeof window.updateNotificationBadges === 'function') {
            window.updateNotificationBadges();
          }
          renderNotifications();
          const toast = document.getElementById('appToast');
          if (toast) {
            toast.textContent = 'Toutes les notifications ont été marquées comme lues.';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
          }
        });
      }
    });
  </script>
</body>
</html>
