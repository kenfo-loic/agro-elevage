<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte & Géolocalisation B2B — AgroElevage Link</title>
  <meta name="description" content="Localisez les producteurs agricoles, hôtels B2B, restaurants, usines de transformation et hubs logistiques à proximité." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/style.css?v=3" />

  <style>
    .map-web-layout {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 20px;
      height: calc(100vh - 140px);
      min-height: 580px;
    }

    .map-filter-btn {
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .map-filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
    }

    .producer-item {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .producer-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .search-suggestion-item:hover {
      background: var(--primary-soft);
    }

    @media (max-width: 960px) {
      .map-web-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      #leafletMapContainer {
        height: 440px !important;
      }
    }
  </style>
</head>
<body>
  <!-- ===================================================================

        </div>

        </div>

        <div class="web-topbar-right">
          <a href="marketplace.html" class="btn-primary-action" style="height: 38px; width: auto; padding: 0 16px; font-size: 13px; gap: 6px; text-decoration: none;">
            <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></span> <span>Marketplace</span>
          </a>

          </a>
        </div>
      </header>

      <!-- Main Content Body -->
      <main class="web-content-body" style="padding-bottom: 24px;">
        
        <div class="map-web-layout">
          
          <!-- Left Column: Producers & B2B Actors List -->
          <div class="web-card" style="display: flex; flex-direction: column; padding: 18px; overflow: hidden;">
            <div style="margin-bottom: 12px;">
              <h2 style="font-family: var(--font-heading); font-size: 16px; font-weight: 800; color: var(--text-main);">Acteurs B2B & Cartographie</h2>
              <p style="font-size: 12px; color: var(--text-muted);">Recherchez et géolocalisez un établissement sur la carte</p>
            </div>

            <!-- Dedicated Enterprise Search Input Box -->
            <div style="position: relative; margin-bottom: 12px;">
              <div class="login-input-wrap" style="background: var(--bg-subtle); border-radius: 10px; border: 1.5px solid var(--border-color);">

              </div>

              <!-- Autocomplete Suggestion Dropdown -->
              <div id="searchSuggestionsBox" style="position: absolute; top: 46px; left: 0; right: 0; background: var(--bg-card); border: 1.5px solid var(--border-color); border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 1000; max-height: 240px; overflow-y: auto; display: none;">
              </div>
            </div>

            <!-- Filter Pills Row -->
            <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px;" id="mapCategoryFilterContainer">
              <button class="map-filter-btn active" data-cat="all">Tout (18)</button>
              <button class="map-filter-btn" data-cat="ferme">Fermes (5)</button>
              <button class="map-filter-btn" data-cat="hotel">Hôtels (4)</button>
              <button class="map-filter-btn" data-cat="restaurant">Restaurants (4)</button>

              <button class="map-filter-btn" data-cat="logistique">Logistique (1)</button>
            </div>

            <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px;" id="producersMapList">
              <!-- Dynamically populated via JS -->
            </div>
          </div>

          <!-- Right Column: Interactive Leaflet Map Canvas -->
          <div class="web-card" style="padding: 0; overflow: hidden; position: relative; border-radius: var(--radius-card);">
            <div id="leafletMapContainer" style="width: 100%; height: 100%; min-height: 520px;"></div>
          </div>

        </div>

      </main>

    </div>
  </div>

    document.addEventListener('DOMContentLoaded', () => {
      const mapContainer = document.getElementById('leafletMapContainer');
      if (!mapContainer) return;

      // Initialize Leaflet Map centered on Yaoundé
      mapInstance = L.map('leafletMapContainer').setView([3.8667, 11.5167], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(mapInstance);

      renderMapElements('all');

      // Category filter buttons
      document.querySelectorAll('.map-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.map-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const cat = btn.getAttribute('data-cat');
          currentFilter = cat;
          const searchVal = (document.getElementById('inputSearchEnterprise')?.value || '').toLowerCase().trim();
          renderMapElements(cat, searchVal);
        });
      });

      // Dedicated Enterprise Search Input logic with Autocomplete
      const inputSearch = document.getElementById('inputSearchEnterprise');
      const suggestionsBox = document.getElementById('searchSuggestionsBox');
      const btnClear = document.getElementById('btnClearMapSearch');
      const globalTopbarSearch = document.getElementById('searchMapInput');

      function handleSearchInput(query) {
        if (btnClear) btnClear.style.display = query ? 'block' : 'none';

        renderMapElements(currentFilter, query);

        if (query.length > 0) {
          const matches = locationsData.filter(loc => 
            loc.name.toLowerCase().includes(query) || 
            loc.sub.toLowerCase().includes(query) || 
            loc.badge.toLowerCase().includes(query) ||
            loc.loc.toLowerCase().includes(query)
          );

          if (matches.length > 0) {
            suggestionsBox.style.display = 'block';
            suggestionsBox.innerHTML = matches.map(loc => `
              <div class="search-suggestion-item" style="padding: 10px 14px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; align-items: center; justify-content: space-between;" onclick="selectEnterprise(${loc.id})">
                <div>
                  <strong style="font-size: 13px; color: var(--text-main); font-family: var(--font-heading);">${loc.name}</strong>
                  <div style="font-size: 11px; color: var(--text-muted);">${loc.badge} • ${loc.loc}</div>
                </div>
                <span style="font-size: 11px; font-weight: 800; color: ${loc.color};">Localiser →</span>
              </div>
            `).join('');
          } else {
            suggestionsBox.style.display = 'block';
            suggestionsBox.innerHTML = '<div style="padding: 12px; font-size: 12px; color: var(--text-muted); text-align: center;">Aucune entreprise trouvée pour "' + query + '"</div>';
          }
        } else {
          suggestionsBox.style.display = 'none';
        }
      }

      if (inputSearch) {
        inputSearch.addEventListener('input', (e) => {
          handleSearchInput(e.target.value.toLowerCase().trim());
        });

        inputSearch.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const query = inputSearch.value.toLowerCase().trim();
            const firstMatch = locationsData.find(loc => 
              loc.name.toLowerCase().includes(query) || 
              loc.sub.toLowerCase().includes(query) ||
              loc.badge.toLowerCase().includes(query)
            );
            if (firstMatch) {
              selectEnterprise(firstMatch.id);
            }
          }
        });
      }

      if (globalTopbarSearch) {
        globalTopbarSearch.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase().trim();
          if (inputSearch) inputSearch.value = e.target.value;
          handleSearchInput(query);
        });
      }

      if (btnClear) {
        btnClear.addEventListener('click', () => {
          if (inputSearch) inputSearch.value = '';
          if (globalTopbarSearch) globalTopbarSearch.value = '';
          btnClear.style.display = 'none';
          suggestionsBox.style.display = 'none';
          renderMapElements(currentFilter, '');
        });
      }
    });

    window.selectEnterprise = function(id) {
      const loc = locationsData.find(l => l.id === id);
      const inputSearch = document.getElementById('inputSearchEnterprise');
      const suggestionsBox = document.getElementById('searchSuggestionsBox');
      const btnClear = document.getElementById('btnClearMapSearch');

      if (loc) {
        if (inputSearch) inputSearch.value = loc.name;
        if (suggestionsBox) suggestionsBox.style.display = 'none';
        if (btnClear) btnClear.style.display = 'block';

        // Fly to location on Leaflet map & open Popup
        focusMap(loc.lat, loc.lng, loc.id);
      }
    };

    // Close suggestions box when clicking outside
    document.addEventListener('click', (e) => {
      const suggestionsBox = document.getElementById('searchSuggestionsBox');
      if (suggestionsBox && !e.target.closest('#inputSearchEnterprise') && !e.target.closest('#searchSuggestionsBox')) {
        suggestionsBox.style.display = 'none';
      }
    });

    function renderMapElements(categoryFilter = 'all', searchQuery = '') {
      const listContainer = document.getElementById('producersMapList');
      if (!listContainer || !mapInstance) return;

      // Clear existing markers
      markersList.forEach(m => mapInstance.removeLayer(m.marker));
      markersList = [];

      const filtered = locationsData.filter(loc => {
        const matchesCat = (categoryFilter === 'all' || loc.cat === categoryFilter);
        const matchesSearch = !searchQuery || 
          loc.name.toLowerCase().includes(searchQuery) || 
          loc.sub.toLowerCase().includes(searchQuery) || 
          loc.loc.toLowerCase().includes(searchQuery) ||
          loc.badge.toLowerCase().includes(searchQuery);
        return matchesCat && matchesSearch;
      });

      // Render Sidebar List
      if (filtered.length === 0) {
        listContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Aucun établissement trouvé.</div>';
      } else {
        listContainer.innerHTML = filtered.map(loc => `
          <div class="web-card producer-item" style="padding: 12px; cursor: pointer; border-left: 4px solid ${loc.color};" onclick="focusMap(${loc.lat}, ${loc.lng}, ${loc.id})">
            <div style="display: flex; gap: 10px; align-items: center;">
              <img src="${loc.img}" style="width: 48px; height: 48px; border-radius: 8px; object-fit: cover;" alt="${loc.name}" />
              <div style="flex: 1; min-width: 0;">
                <div style="font-size: 10.5px; font-weight: 800; color: ${loc.color}; text-transform: uppercase; letter-spacing: 0.3px;">${loc.badge}</div>
                <div style="font-weight: 800; font-size: 13px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${loc.name}</div>
                <div style="font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${loc.sub}</div>
                <div style="font-size: 11px; font-weight: 700; color: var(--text-main); margin-top: 2px;">${loc.loc} • Note ${loc.rating}/5</div>
              </div>
            </div>
          </div>
        `).join('');
      }

      // Add Circle Markers to Leaflet Map
      filtered.forEach(loc => {
        const marker = L.circleMarker([loc.lat, loc.lng], {
          radius: 9,
          fillColor: loc.color,
          color: "#ffffff",
          weight: 2.5,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(mapInstance);

        const popupContent = `
          <div style="font-family: var(--font-body); width: 200px;">
            <img src="${loc.img}" style="width: 100%; height: 90px; border-radius: 6px; object-fit: cover; margin-bottom: 6px;" />
            <span style="font-size: 10px; font-weight: 800; color: ${loc.color}; text-transform: uppercase;">${loc.badge}</span>
            <h4 style="font-size: 13px; font-weight: 800; margin: 2px 0 4px; color: #1e293b;">${loc.name}</h4>
            <p style="font-size: 11.5px; color: #64748b; margin-bottom: 8px;">${loc.sub}</p>
            <div style="font-size: 11px; font-weight: 700; color: #059669; margin-bottom: 8px;">${loc.loc}</div>
            <a href="marketplace.html" style="display: block; text-align: center; background: #059669; color: #ffffff; padding: 6px; border-radius: 6px; font-size: 11.5px; font-weight: 800; text-decoration: none;">Voir les offres B2B ›</a>
          </div>
        `;

        marker.bindPopup(popupContent);
        markersList.push({ id: loc.id, loc, marker });
      });
    }

    function focusMap(lat, lng, id) {
      if (!mapInstance) return;
      mapInstance.flyTo([lat, lng], 14, { duration: 1 });
      const found = markersList.find(m => m.id === id);
      if (found) {
        found.marker.openPopup();
      }
    }
  </script>
</body>
</html>
