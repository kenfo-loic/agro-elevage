<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace Agricole — AgroElevage Link</title>
  <meta name="description" content="Place de marché agricole sécurisée. Achetez et vendez récoltes, cheptels, tubercules et fruits directement entre producteurs et acheteurs." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <!-- ===================================================================
       WEB APPLICATION SHELL (PURE FULLSCREEN WEB APP)
       =================================================================== -->
  <div class="web-app-shell">
    
    <!-- Shared Web Sidebar (Injected by layout.js) -->
    <div id="sidebar-root"></div>

    <!-- Main Content Area -->
    <div class="web-main-container">
      
      <!-- Top Navigation Bar -->
      <header class="web-topbar">
        <div class="web-topbar-left">
          <button class="web-menu-toggle" id="btnToggleMobileMenu" title="Ouvrir le menu de navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg> <span>Menu</span></button>
          <span class="web-page-heading-title">Marketplace Agricole</span>
        </div>

        <div class="web-topbar-search">
          <span class="web-search-lens-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
          <input type="text" class="web-global-search-input" id="inputMarketSearch" placeholder="Rechercher des tomates, maïs, poulets, manioc..." />
        </div>

        <div class="web-topbar-right">
          <a href="passer_commande.html" class="btn-primary-action" style="height: 38px; width: auto; padding: 0 16px; font-size: 13px; gap: 6px; text-decoration: none;">
            <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span> <span>Passer Commande</span>
          </a>

          <a href="notifications.html" class="web-topbar-btn-circle" title="Notifications">
            <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
            <span class="web-notif-dot"></span>
          </a>

          <a href="profil.html" class="web-topbar-btn-circle" title="Profil">
            <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          </a>
        </div>
      </header>

      <!-- Main Content Body -->
      <main class="web-content-body">
        
        <!-- Marketplace Banner -->
        <div class="web-card" style="background: linear-gradient(135deg, #15803d 0%, #166534 100%); color: #ffffff; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
          <div>
            <span style="font-size: 12px; background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 20px; font-weight: 700;">PRODUITS FRAIS DU TERROIR</span>
            <h1 style="font-family: var(--font-heading); font-size: 22px; font-weight: 800; margin: 6px 0 2px;">Place de Marché Agricole Sécurisée</h1>
            <p style="font-size: 13px; opacity: 0.9;">Achetez directement auprès de producteurs vérifiés. Vos fonds sont protégés en séquestre jusqu'à la livraison.</p>
          </div>
          <div style="display: flex; gap: 10px;">
            <a href="carte_et_geoloc.html" class="btn-primary-action" style="background: #ffffff; color: var(--primary-dark); font-weight: 800; height: 38px; width: auto; padding: 0 18px; text-decoration: none; border-radius: 9999px;">
               Voir sur la Carte
            </a>
          </div>
        </div>

        <!-- Filter Chips & Search -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;">
          <div class="category-chips-row" id="marketCategoryChips" style="margin-bottom: 0;">
            <button class="cat-chip active" data-cat="all">Tous les produits</button>
            <button class="cat-chip" data-cat="maraichage">Maraîchage</button>
            <button class="cat-chip" data-cat="tubercules">Tubercules</button>
            <button class="cat-chip" data-cat="cereales">Céréales</button>
            <button class="cat-chip" data-cat="elevage">Élevage & Volailles</button>
            <button class="cat-chip" data-cat="fruits">Fruits & Vergers</button>
          </div>

          <div style="font-size: 12.5px; color: var(--text-muted); font-weight: 600;" id="marketProductCount">
            Affichage des produits certifiés
          </div>
        </div>

        <!-- Responsive Products Grid (Dynamically Populated from Database) -->
        <div class="products-grid" id="marketProductsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px;">
          <!-- Dynamically populated by JS from Database / Supabase -->
        </div>

      </main>

      <!-- Interactive Toast -->
      <div class="toast-msg" id="appToast">Produit ajouté au panier !</div>

    </div>
  </div>

  <!-- Supabase JS & API Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api-client.js"></script>

  <!-- Navigation & Layout Helpers -->
  <script src="js/layout.js"></script>
  <script src="js/mpa_app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('marketProductsGrid');
      const countEl = document.getElementById('marketProductCount');
      const searchInput = document.getElementById('inputMarketSearch');

      // 9 Base Catalog Products corresponding to PostgreSQL database seed
      const baseDefaultProducts = [
        { id: 'prod_1', name: 'Tomates fraîches Roma (Cagettes 20kg)', category: 'maraichage', price: 12500, unit: 'cagette', stock: 120, location: 'Foumbot, Ouest', ownerName: 'Paul Nguema', ownerPhone: '+237 690 12 34 56', image: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400' },
        { id: 'prod_2', name: 'Poulets Goliath fermiers vivants', category: 'elevage', price: 3500, unit: 'u', stock: 50, location: 'Bafoussam, Ouest', ownerName: 'Marie Tchakounté', ownerPhone: '+237 691 23 45 67', image: 'https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?w=400' },
        { id: 'prod_3', name: 'Maïs Blanc Séché (Sacs 50kg)', category: 'cereales', price: 12000, unit: 'sac', stock: 300, location: 'Garoua, Nord', ownerName: 'Ibrahim Bello', ownerPhone: '+237 692 34 56 78', image: 'https://images.unsplash.com/photo-1551754655-cd27e38d2076?w=400' },
        { id: 'prod_4', name: 'Poivre Blanc de Penja IGP (Sacs 5kg)', category: 'maraichage', price: 35000, unit: 'sac', stock: 45, location: 'Njombé-Penja, Moungo', ownerName: 'Emmanuel Manga', ownerPhone: '+237 693 45 67 89', image: 'https://images.unsplash.com/photo-1599940824399-b87987ceb72a?w=400' },
        { id: 'prod_5', name: 'Poivrons Verts & Jaunes Bio', category: 'maraichage', price: 850, unit: 'kg', stock: 150, location: 'Yaoundé, Cameroun', ownerName: 'Kenfo Loic (Admin)', ownerPhone: '+237 693 412 317', image: 'https://images.unsplash.com/photo-1563565375-f3fdfdbefa83?w=400' },
        { id: 'prod_6', name: 'Pommes de Terre de Dschang (Sacs 25kg)', category: 'tubercules', price: 8000, unit: 'sac', stock: 200, location: 'Dschang, Ouest', ownerName: 'Paul Nguema', ownerPhone: '+237 690 12 34 56', image: 'https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=400' },
        { id: 'prod_7', name: 'Régimes de Banane Plantain Gros Michel', category: 'fruits', price: 4500, unit: 'u', stock: 90, location: 'Njombé, Moungo', ownerName: 'Emmanuel Manga', ownerPhone: '+237 693 45 67 89', image: 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400' },
        { id: 'prod_8', name: 'Ananas Pain de Sucre doux (Cartons 10kg)', category: 'fruits', price: 6000, unit: 'carton', stock: 110, location: 'Awae, Centre', ownerName: 'Marie Tchakounté', ownerPhone: '+237 691 23 45 67', image: 'https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=400' },
        { id: 'prod_9', name: 'Bâtons de Manioc & Gari Blanc (Sacs 50kg)', category: 'tubercules', price: 14000, unit: 'sac', stock: 180, location: 'Sa\'a, Centre', ownerName: 'Ibrahim Bello', ownerPhone: '+237 692 34 56 78', image: 'https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=400' }
      ];

      function getProductsList() {
        const deleted = JSON.parse(localStorage.getItem('agroelevage_deleted_prod_ids') || '[]');
        let stored = localStorage.getItem('agroelevage_products');
        let list = [];
        if (stored) {
          try {
            list = JSON.parse(stored);
          } catch (e) {}
        }
        if (!list || list.length === 0) {
          list = [...baseDefaultProducts];
          localStorage.setItem('agroelevage_products', JSON.stringify(list));
        } else {
          // Merge missing base catalog items
          let modified = false;
          baseDefaultProducts.forEach(bp => {
            if (!list.some(p => String(p.id) === String(bp.id)) && !deleted.includes(String(bp.id))) {
              list.push(bp);
              modified = true;
            }
          });
          if (modified) {
            localStorage.setItem('agroelevage_products', JSON.stringify(list));
          }
        }
        return list.filter(p => !deleted.includes(String(p.id)) && p.isAvailable !== false);
      }

      function updateProductCount() {
        if (!countEl) return;
        const visibleCards = document.querySelectorAll('#marketProductsGrid .product-item-card:not([style*="display: none"])');
        countEl.textContent = `Affichage de ${visibleCards.length} produit${visibleCards.length > 1 ? 's' : ''} certifié${visibleCards.length > 1 ? 's' : ''}`;
      }

      function renderMarketplace() {
        if (!grid) return;
        grid.innerHTML = '';

        const products = getProductsList();
        const currentUserRole = (localStorage.getItem('ago_user_role') || '').toLowerCase();
        const currentUserEmail = (localStorage.getItem('ago_user_email') || '').toLowerCase();
        const isAdmin = currentUserEmail === 'agro2026elevage@gmail.com' || currentUserRole === 'admin';

        // Admin Notification Banner
        let adminBanner = document.getElementById('marketplaceAdminBanner');
        if (isAdmin && !adminBanner) {
          adminBanner = document.createElement('div');
          adminBanner.id = 'marketplaceAdminBanner';
          adminBanner.style.cssText = 'background: #fee2e2; border: 1.5px solid #fca5a5; padding: 10px 16px; border-radius: 10px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;';
          adminBanner.innerHTML = `
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #b91c1c;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <span>Privilèges Administrateur : Vous pouvez modifier ou supprimer directement n'importe quel produit.</span>
            </div>
            <a href="admin.html" class="btn-secondary" style="height: 32px; padding: 0 12px; font-size: 12px; font-weight: 700; background: #b91c1c; color: #ffffff; text-decoration: none; border-radius: 6px;">Ouvrir Espace Admin</a>
          `;
          const mainBody = document.querySelector('.web-content-body');
          if (mainBody) mainBody.prepend(adminBanner);
        }

        if (products.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px;">Aucun produit disponible pour le moment.</div>';
          updateProductCount();
          return;
        }

        products.forEach(p => {
          const cleanWa = (p.whatsapp || p.ownerPhone || '+237690123456').replace(/[^\d+]/g, '');
          const card = document.createElement('div');
          card.className = 'web-card product-item-card';
          card.setAttribute('data-cat', p.category || 'maraichage');
          card.setAttribute('data-prod-id', String(p.id));
          card.style.cssText = 'padding: 14px; display: flex; flex-direction: column; cursor: pointer; position: relative;';
          card.onclick = () => window.location.href = `detail_produit.html?id=${p.id}`;

          let adminBadgeHtml = '';
          let adminActionsHtml = '';
          if (isAdmin) {
            adminBadgeHtml = `<span style="position: absolute; top: 22px; right: 22px; background: rgba(185, 28, 28, 0.9); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 9999px; z-index: 2;">ADMIN</span>`;
            adminActionsHtml = `
              <div style="display: flex; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); justify-content: flex-end;" onclick="event.stopPropagation()">
                <a href="ajouter_produit.html?edit_id=${p.id}" style="padding: 4px 8px; background: #3b82f6; color: #ffffff; border-radius: 4px; font-size: 11px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 3px;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                  Modifier
                </a>
                <button type="button" onclick="deleteMarketplaceProductByAdmin('${p.id}', '${(p.name || '').replace(/'/g, "\\'")}')" style="padding: 4px 8px; background: #ef4444; color: #ffffff; border-radius: 4px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; gap: 3px;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                  Supprimer
                </button>
              </div>
            `;
          }

          card.innerHTML = `
            ${adminBadgeHtml}
            <div style="position: relative; height: 160px; border-radius: 12px; overflow: hidden; margin-bottom: 12px;">
              <img src="${p.image || p.imageUrl || 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400'}" style="width: 100%; height: 100%; object-fit: cover;" alt="${p.name}" />
            </div>
            <div style="flex: 1; display: flex; flex-direction: column;">
              <div style="font-family: var(--font-heading); font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 2px;" class="prod-title">${p.name}</div>
              <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">${p.ownerName ? p.ownerName + ' • ' : ''}${p.location || 'Cameroun'}</div>
              <div style="display: flex; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-subtle); align-items: center; justify-content: space-between;">
                <div>
                  <div style="font-family: var(--font-heading); font-size: 15px; font-weight: 800; color: var(--primary);">${(p.price || 0).toLocaleString('fr-FR')} FCFA <span style="font-size: 11px; font-weight: 500; color: var(--text-muted);">/ ${p.unit || 'kg'}</span></div>
                  <div style="font-size: 11px; color: var(--text-muted);">Stock : ${p.quantity || p.stock || 0} ${p.unit || 'kg'}</div>
                </div>
                <div style="display: flex; gap: 6px; align-items: center;">
                  <a href="https://wa.me/${cleanWa}?text=${encodeURIComponent('Bonjour, je suis intéressé par votre produit ' + p.name + ' sur AgroElevage Link.')}" target="_blank" class="btn-secondary" style="width: auto; height: 32px; padding: 0 10px; font-size: 12px; font-weight: 700; background: #25d366; color: #ffffff; text-decoration: none; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;" onclick="event.stopPropagation()" title="Discuter directement sur WhatsApp">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    WhatsApp
                  </a>
                  <a href="passer_commande.html?product_id=${p.id}" class="btn-primary-action" style="width: auto; height: 32px; padding: 0 10px; font-size: 12px; text-decoration: none;" onclick="event.stopPropagation()">
                    Commander
                  </a>
                </div>
              </div>
              ${adminActionsHtml}
            </div>
          `;
          grid.appendChild(card);
        });

        // Apply active filters if any
        applyFilters();
        updateProductCount();
      }

      window.deleteMarketplaceProductByAdmin = function(productId, prodName) {
        if (!confirm(`[ADMIN] Confirmez-vous la suppression définitive du produit "${prodName}" ?`)) return;
        
        let deleted = JSON.parse(localStorage.getItem('agroelevage_deleted_prod_ids') || '[]');
        if (!deleted.includes(String(productId))) {
          deleted.push(String(productId));
          localStorage.setItem('agroelevage_deleted_prod_ids', JSON.stringify(deleted));
        }

        let list = JSON.parse(localStorage.getItem('agroelevage_products') || '[]');
        list = list.filter(p => String(p.id) !== String(productId));
        localStorage.setItem('agroelevage_products', JSON.stringify(list));

        if (window.AgroApi && typeof window.AgroApi.deleteProduct === 'function') {
          window.AgroApi.deleteProduct(productId);
        }

        renderMarketplace();

        const toast = document.getElementById('appToast');
        if (toast) {
          toast.textContent = `[Admin] Produit "${prodName}" supprimé avec succès !`;
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2500);
        }
        window.dispatchEvent(new Event('agroelevage_products_updated'));
      };

      function applyFilters() {
        const activeChip = document.querySelector('.cat-chip.active');
        const cat = activeChip ? activeChip.getAttribute('data-cat') : 'all';
        const q = (searchInput ? searchInput.value : '').toLowerCase().trim();

        const cards = document.querySelectorAll('#marketProductsGrid .product-item-card');
        cards.forEach(card => {
          const cardCat = card.getAttribute('data-cat');
          const cardText = card.textContent.toLowerCase();
          const matchCat = (cat === 'all' || cardCat === cat);
          const matchSearch = (!q || cardText.includes(q));

          if (matchCat && matchSearch) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
        updateProductCount();
      }

      // Category filter chips handler
      const chips = document.querySelectorAll('.cat-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          applyFilters();
        });
      });

      // Search handler
      if (searchInput) {
        searchInput.addEventListener('input', applyFilters);
      }

      // Initial rendering
      renderMarketplace();

      // Read URL ?search= param
      const urlParams = new URLSearchParams(window.location.search);
      const initialQuery = urlParams.get('search');
      if (initialQuery && searchInput) {
        searchInput.value = initialQuery;
        applyFilters();
      }

      window.addEventListener('storage', renderMarketplace);
      window.addEventListener('agroelevage_products_updated', renderMarketplace);
    });
  </script>
</body>
</html>
