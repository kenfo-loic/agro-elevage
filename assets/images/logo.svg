<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Golden Wheat / Sun Gradient -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Glowing Shield/Badge Container -->
  <rect x="8" y="8" width="144" height="144" rx="42" fill="url(#logoBg)" stroke="#ffffff" stroke-width="4" filter="url(#crispShadow)"/>
  
  <!-- Subtle Internal Ring -->
  <rect x="14" y="14" width="132" height="132" rx="36" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>

  <!-- Sun Arc / Sunrise in Background -->
  <path d="M 40 95 A 40 40 0 0 1 120 95 Z" fill="url(#goldGlow)" opacity="0.95"/>
  <circle cx="80" cy="95" r="16" fill="#ffffff" opacity="0.9"/>

  <!-- Stylized Livestock Silhouette & Horns (Left/Right balance) -->
  <path d="M 42 62 C 55 45, 105 45, 118 62 C 112 76, 100 82, 80 84 C 60 82, 48 76, 42 62 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Left Agricultural Sprout / Leaf (Vibrant Bright Green) -->
  <path d="M 80 118 C 50 114, 40 85, 52 64 C 70 70, 82 88, 80 118 Z" fill="url(#leafGlow)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Right Golden Grain Ear / Elevage (Vibrant Golden Amber) -->
  <path d="M 80 118 C 110 114, 120 85, 108 64 C 90 70, 78 88, 80 118 Z" fill="url(#goldGlow)" stroke="#ffffff" stroke-width="2"/>

  <!-- Grain Kernels Detail -->
  <circle cx="96" cy="74" r="4.5" fill="#ffffff"/>
  <circle cx="104" cy="85" r="4" fill="#ffffff"/>
  <circle cx="94" cy="96" r="3.5" fill="#ffffff"/>

  <!-- Central Connection Link Stem (Pure Bright White) -->
  <path d="M 80 128 L 80 72" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Central Glowing Tech Node (Link) -->
  <circle cx="80" cy="68" r="8" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <circle cx="80" cy="68" r="4" fill="#15803d"/>

  <!-- Base Connection Ribbon Arc -->
  <path d="M 54 126 Q 80 138 106 126" stroke="#fde047" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
